name: fast_tests.no_docker

on:
  # Run on every PR to master that is ready to review (i.e., not draft).
  pull_request:
    # https://github.community/t/dont-run-actions-on-draft-pull-requests/16817/19
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - master
  # Run for every change in master.
  push:
    branches:
      - master
  # Run manually.
  workflow_dispatch:
  schedule:
    # Run this once a day even if there are no commits.
    - cron: '0 0 */1 * *'

env:
  CSFY_CI: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # This is required for actions/checkout.
  contents: read
  # This is required for posting the status of the job when triggered
  # manually.
  statuses: write

jobs:
  run_pytest_log:
    # We expect user to not execute manual run in a draft PR.
    # The reason is `github.event.pull_request.draft` is evaluated as empty
    # string and the condition is always true which is not the right state.
    if: ${{ github.event.pull_request.draft == false }}
    name: Run pytest_log on class content dirs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Some scripts declare their dependencies inline and are meant to be run
      # via `uv run`.
      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # To access modules in `helpers_root`, make sure PYTHONPATH includes
      # it, just as it's set in `setenv.sh`.
      - name: Update PYTHONPATH
        run: |
          PYTHONPATH="$(realpath .):$(realpath helpers_root)"
          echo "PYTHONPATH=$PYTHONPATH" >> $GITHUB_ENV

      # `setenv.sh` adds every first-level `dev_scripts_helpers` subdirectory
      # to `PATH` via `set_path()`, but `setenv.sh` itself can't be sourced
      # here (it activates a pre-built thin-client venv that doesn't exist on a
      # bare CI runner). Replicate just the PATH portion.
      - name: Update PATH
        run: |
          find "$(realpath helpers_root/dev_scripts_helpers)" -maxdepth 1 -type d >> "$GITHUB_PATH"

      # Install the packages that are required to run the tests via GH,
      # matching what `common_run_tests.yml` installs for other repos.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r helpers_root/.github/gh_requirements.txt

      - name: Run pytest_log
        run: |
          helpers_root/dev_scripts_helpers/testing/pytest_log --no_clear_screen \
            --ignore=helpers_root -m "not need_dev_container" \
            book_springer book_cs_refreshers class_project class_scripts

      - name: Upload pytest log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log
          path: tmp.pytest_log.txt
          if-no-files-found: ignore

      # In case of manual run, this workflow step will not be skipped and
      # info in the step will be in format as seen in `with` statement.
      # Blank with no info and skipped otherwise.
      - name: Post status if was triggered manually
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        uses: guibranco/github-status-action-v2@main
        with:
          authToken: ${{ secrets.GH_ACTION_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
          context: run_pytest_log
          description: 'Job is done (manual run)'
          state: ${{ job.status }}
          sha: ${{ github.sha }}
          target_url: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
