name: update_helpers_submodule

# Move the `helpers_root` submodule pointer to the latest `master` of `helpers`,
# but only if the regressions pass with the new `helpers` code.
#
# See `helpers_root/docs/tools/dev_system/all.update_helpers_submodule.how_to_guide.md`.

on:
  # Run manually.
  workflow_dispatch:
  # Run once a day at 1:00 am UTC even if there are no commits.
  schedule:
    - cron: '0 1 */1 * *'

env:
  CSFY_CI: true

# Do not run two updates at the same time.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  # This is required for actions/checkout and for pushing the pointer update.
  contents: write

jobs:
  update_helpers_submodule:
    name: Update the helpers_root submodule pointer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          # Use a PAT, if available, so that the pushed commit triggers the
          # other workflows. A push done with `GITHUB_TOKEN` does not.
          token: ${{ secrets.GH_ACTION_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}

      # Check whether `helpers_root` is behind `master` of `helpers`. If it is
      # not, there is nothing to do and the steps below are skipped.
      - name: Check if helpers_root is up to date
        id: check
        run: |
          git -C helpers_root fetch origin master
          HEAD_HASH=$(git -C helpers_root rev-parse HEAD)
          MASTER_HASH=$(git -C helpers_root rev-parse FETCH_HEAD)
          echo "HEAD_HASH=$HEAD_HASH"
          echo "MASTER_HASH=$MASTER_HASH"
          if [[ "$HEAD_HASH" == "$MASTER_HASH" ]]; then
            echo "helpers_root is up to date"
            echo "stale=false" >> $GITHUB_OUTPUT
          elif git -C helpers_root merge-base --is-ancestor "$HEAD_HASH" "$MASTER_HASH"; then
            echo "helpers_root is behind master"
            # Fast-forward the submodule to the tip of `master`.
            git -C helpers_root checkout --detach "$MASTER_HASH"
            echo "stale=true" >> $GITHUB_OUTPUT
          else
            # The pointer was set on purpose to a commit that is not in `master`
            # (e.g., a feature branch of `helpers`). Do not move it backwards.
            echo "::warning::helpers_root points to $HEAD_HASH, which is not an ancestor of master: skipping"
            echo "stale=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Python
        if: steps.check.outputs.stale == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Some scripts declare their dependencies inline and are meant to be run
      # via `uv run`.
      - name: Install uv
        if: steps.check.outputs.stale == 'true'
        uses: astral-sh/setup-uv@v5

      # To access modules in `helpers_root`, make sure PYTHONPATH includes it,
      # just as it is set in `setenv.sh`.
      - name: Update PYTHONPATH
        if: steps.check.outputs.stale == 'true'
        run: |
          PYTHONPATH="$(realpath .):$(realpath helpers_root)"
          echo "PYTHONPATH=$PYTHONPATH" >> $GITHUB_ENV

      # `setenv.sh` cannot be sourced on a bare CI runner, so replicate its PATH
      # setup.
      - name: Update PATH
        if: steps.check.outputs.stale == 'true'
        run: |
          find "$(realpath helpers_root/dev_scripts_helpers)" -maxdepth 1 -type d >> "$GITHUB_PATH"

      - name: Install dependencies
        if: steps.check.outputs.stale == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r helpers_root/.github/gh_requirements.txt

      # Before pushing any commit, perform a sanity check, i.e., run the
      # regressions with the new `helpers` code. Keep this command in sync with
      # `fast_tests.no_docker.yml`.
      - name: Run pytest_log
        if: steps.check.outputs.stale == 'true'
        run: |
          helpers_root/dev_scripts_helpers/testing/pytest_log --no_clear_screen \
            --ignore=helpers_root -m "not need_dev_container" \
            book_springer book_cs_refreshers class_project class_scripts

      - name: Upload pytest log
        if: ${{ always() && steps.check.outputs.stale == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log
          path: tmp.pytest_log.txt
          if-no-files-found: ignore

      # Commit only the pointer, not any other file touched by the tests.
      - name: Commit and push the new pointer
        if: steps.check.outputs.stale == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add helpers_root
          git commit -m "Update helpers repo"
          git push
