[pytest]
# Load the course `helpers_root/conftest.py` (on `PYTHONPATH` via `setenv.sh`),
# which `hunitest.TestCase` needs.
# NOTE: Drop this file when moving the code into `umd_classes`.
addopts = -p conftest
testpaths = test benchmark/exploit_tests
markers =
    qa: marker used by the course helpers
filterwarnings =
    ignore::DeprecationWarning
